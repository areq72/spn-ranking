@if (player()) {
  <div class="player-header">
    <div class="container">
      <div class="player-row">
        <div class="icon-container">
          <div class="player-icon">
            <img
              [src]="'https://ddragon.leagueoflegends.com/cdn/' + environment.lolPatch + '/img/profileicon/' + player()?.profileInfo?.profileIconId + '.png'"
              alt="Summoner icon" />
          </div>
          <div class="player-rank">
            {{ player()?.profileInfo?.summonerLevel }}
          </div>
        </div>
        <div class="player-identity">
          <div class="player-name">{{ player()?.name }}</div>
          <div class="summoner-row" (click)="player()?.navigateToOPGG()">
            <span class="summoner-name">{{ player()?.summonerName }}</span>
            <span class="summoner-tag">#{{ player()?.summonerTag }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
}
